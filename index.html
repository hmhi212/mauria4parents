<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mauria</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-width app column (header, scrolling page, bottom tab bar) centred on larger screens */
:root{
  --plum:#2e1d44;
  --plum-ink:#2d1e43;
  --cream:#fbf9f6;
  --peach:#fde4d6;
  --peach-bg:#fce3d6;
  --orange:#d48a3e;
  --slate:#64748b;
  --muted:#8b95a7;
  --line:#e3e8f0;
  --green:#3f9d6b;
  --red:#dc3b3f;
  --event-a:#6b54a5;
  --event-b:#45325f;
  --stage:#d9d6dd;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--stage);color:#111;font-family:Inter,-apple-system,"Segoe UI",system-ui,sans-serif;font-size:16px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--plum)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{display:block}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.app{position:relative;height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;background:var(--cream);overflow:hidden;box-shadow:0 0 40px rgba(30,20,50,.18)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{background:var(--plum);color:#fff;flex:none}
.top .gutter{height:62px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:25px;font-weight:700;letter-spacing:-.01em}
.top-actions{display:flex;align-items:center;gap:18px}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.burger{width:40px;height:40px;display:grid;place-items:center}
.burger .ic{width:32px;height:32px;stroke-width:2.2}

/* page */
.page{position:relative;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden}
.dots{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.dots i{position:absolute;border-radius:50%;background:#f4b9a0}
.page-in{position:relative;padding-block:20px 28px}
h1{margin:0;font-size:33px;line-height:1.15;font-weight:700;color:var(--plum-ink);letter-spacing:-.015em}
h2{margin:30px 0 14px;font-size:33px;line-height:1.1;font-weight:700;color:var(--plum-ink);letter-spacing:-.015em}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sq{width:50px;height:50px;border-radius:12px;background:var(--plum);color:#fff;display:grid;place-items:center;flex:none}
.sq .ic{width:22px;height:22px}

.card{background:#fff;border-radius:18px;box-shadow:0 2px 10px rgba(30,20,60,.08)}

/* banner */
.banner{margin-top:20px;background:var(--peach-bg);border-radius:16px;padding:16px 22px 18px}
.banner b{display:block;font-size:17.5px;line-height:1.25;font-weight:700;color:#111;margin-bottom:3px}
.banner p{margin:0;font-size:16px;line-height:1.4;color:#333}

.bars span{flex:1;height:4px;border-radius:2px;background:rgba(60,50,40,.2);position:relative;overflow:hidden}
.bars span:first-child::after{content:"";position:absolute;inset:0 85% 0 0;background:var(--plum)}

/* event cards (home) */
.ev{display:block;width:100%;text-align:left;padding:16px 16px 14px;margin-bottom:14px;position:relative}
.ev .t{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ev .t strong{font-size:17.5px;font-weight:600;line-height:1.3;color:#111}
.chip{flex:none;background:var(--peach);color:#222;font-size:14.5px;padding:7px 14px;border-radius:10px;line-height:1.2}
.ev .m{display:flex;align-items:center;gap:6px;margin-top:12px;color:var(--slate);font-size:16px}
.ev .m .ic{width:20px;height:20px}
.ev .m .where{margin-left:auto;margin-right:24px;display:flex;align-items:center;gap:6px;width:50%}
.ev .go{position:absolute;right:14px;bottom:12px;color:#aeb6c3}
.ev .go .ic{width:16px;height:16px}

/* planning */
.tools{display:flex;align-items:center;gap:10px}
.salles{height:50px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:0 16px;display:flex;align-items:center;gap:10px;font-size:17px;font-weight:500;color:#111;margin-left:auto}
.salles .ic{width:20px;height:20px}
.seg{margin:20px 0 14px;display:flex;align-items:center;gap:8px;padding:6px 0;justify-content:flex-end}
.pill{height:30px;padding:0 15px;border-radius:999px;background:#fff;font-size:17px;font-weight:500;color:var(--plum-ink);box-shadow:0 1px 4px rgba(30,20,60,.1);display:grid;place-items:center;height:44px;min-width:44px}
.pill.on{background:linear-gradient(180deg,#e68a4c,#c2683c);color:#fff;box-shadow:0 6px 16px rgba(226,125,60,.4)}
.pill.sp{margin-left:8px}
.pill .ic{width:20px;height:20px;stroke-width:2.4}
.grid{display:grid;border:1px solid #d8d6d6;background:#fff;position:relative}
.grid.week{grid-template-columns:44px repeat(6,1fr)}
.grid.day{grid-template-columns:44px 1fr}
.gh{padding:12px 0 8px;text-align:center;font-weight:700;font-size:15.5px;line-height:1.3;color:#222;border-bottom:1px solid #d8d6d6;border-left:1px solid #d8d6d6;background:#fff}
.gh:first-child{border-left:0}
.hours{position:relative}
.hours div{position:absolute;left:0;right:0;border-top:1px solid #d8d6d6;font-size:14.5px;font-weight:700;padding:5px 0 0 7px;box-sizing:border-box}
.hours div::after,.col .l::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px dashed #d8d6d6}
.hours div::after{left:0}
.col{position:relative;border-left:1px solid #d8d6d6}
.col .l{position:absolute;left:0;right:0;border-top:1px solid #d8d6d6}
.col.today{background:#faebe5}
.pe{position:absolute;left:0;right:0;border-radius:8px;padding:5px 6px;color:#fff;font-size:11.5px;line-height:1.38;overflow:hidden;text-align:left;background:linear-gradient(180deg,var(--event-a),var(--event-b));box-shadow:0 6px 14px rgba(40,25,70,.2);word-break:break-word}
.pe.os{background:linear-gradient(180deg,#bd5f3a,#ea8540);box-shadow:0 6px 16px rgba(226,125,60,.3)}
.pe b{display:block;font-weight:700}
.now{position:absolute;height:0;border-top:1.5px solid #e11;z-index:2}
.now-tri{position:absolute;left:3px;width:0;height:0;border:6px solid transparent;border-left:10px solid #e11;border-right:0;z-index:2}

/* tabs / filters */
.chips{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:2px max(16px,env(safe-area-inset-right,0px));-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 18px,#000 calc(100% - 18px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 18px,#000 calc(100% - 18px),transparent 100%)}
.chips::-webkit-scrollbar{display:none}
.chips+.chips{margin-top:16px}
.fc{flex:none;height:50px;padding:0 21px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:17.5px;font-weight:500;color:#111;white-space:nowrap}
.fc.on{background:var(--plum);border-color:var(--plum);color:#fff}
.fc.sm{height:46px;padding:0 17px}
.chips.end{justify-content:flex-start}

/* notes */
.note-info{margin-top:18px;padding:13px 16px;font-size:15.5px;color:var(--slate);display:flex;align-items:center;gap:10px}
.note-info .ic{width:18px;height:18px;flex:none}
.grade{display:block;width:100%;text-align:left;margin-top:14px;padding:16px 16px 14px;position:relative}
.grade .g{display:flex;gap:18px;align-items:flex-start}
.gv{width:108px;flex:none;color:var(--orange)}
.gv .n{font-size:35px;font-weight:600;line-height:1;letter-spacing:-.02em}
.gv .n sup{font-size:14px;font-weight:500;color:var(--slate);vertical-align:top;margin-left:3px;position:relative;top:-2px}
.gv .a{display:block;margin-top:6px;font-size:16px;font-weight:500;color:var(--slate);padding-left:9px}
.gt{flex:1;min-width:0}
.gt .h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}

.gt .d{font-size:17px;color:var(--slate);margin-top:4px}
.grade .c{margin-top:6px;color:var(--slate);font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:36px}
.grade .go{position:absolute;right:14px;bottom:12px;color:#aeb6c3}
.grade .go .ic{width:16px;height:16px}
.empty{margin-top:24px;padding:30px 22px;text-align:center}
.empty .badge{width:90px;height:90px;border-radius:50%;background:#eff1f4;color:#5b6b85;display:grid;place-items:center;margin:0 auto 20px}
.empty .badge .ic{width:40px;height:40px;stroke-width:2}
.empty h3{margin:0;font-size:25px;font-weight:600;color:#111}

.btn{display:inline-flex;align-items:center;gap:12px;margin-top:26px;height:56px;padding:0 24px;border-radius:12px;background:var(--plum);color:#fff;font-size:20px;font-weight:500}

/* absences */
.sum{margin-top:22px;padding:30px 22px 22px}
.sum .tot{display:flex;align-items:baseline;gap:20px;padding:0 0 30px 0}
.sum .tot span{color:var(--slate);font-size:17.5px}
.sum .tot b{font-size:55px;font-weight:700;color:var(--plum-ink);letter-spacing:-.03em;line-height:1}
.sum .two{display:grid;grid-template-columns:1fr 1fr;border-top:1.5px solid #dfe3f1;padding-top:22px}
.sum .two>div+div{border-left:1.5px solid #e3e7ee;padding-left:20px}
.sum .two span{color:var(--slate);font-size:19px}
.sum .two b{display:block;font-size:38px;font-weight:600;margin-top:8px;letter-spacing:-.02em}

.ab{margin-top:22px;padding:20px 18px;display:flex;gap:30px;align-items:center}
.ab .d{width:126px;flex:none;font-size:45px;font-weight:600;color:var(--orange);letter-spacing:-.02em;padding-left:2px;line-height:1}
.ab .d.ok{color:var(--green)}
.ab strong{display:block;font-size:22.5px;font-weight:500;line-height:1.3}
.ab p{margin:4px 0 0;font-size:21px;line-height:1.5;color:#1a1a1a}
.ab small{display:block;margin-top:4px;font-size:19px;color:var(--slate)}
.ab .x{min-width:0}

/* tab bar */
.tabs{flex:none;border-top:1px solid #ece9e4;background:var(--cream);position:relative;z-index:3}
.tabs .gutter{display:grid;grid-template-columns:repeat(5,1fr);padding-block:8px 10px;padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:13.5px;font-weight:500;padding:0}
.tab .p{width:56px;height:34px;border-radius:17px;display:grid;place-items:center}
.tab .ic{width:26px;height:26px}
.tab.on{color:var(--plum-ink)}
.tab.on .p{background:#e7e7ea}
.tab:focus-visible,button:focus-visible{outline:2px solid #e68a4c;outline-offset:2px;border-radius:10px}

/* overlays */
.ov{position:absolute;inset:0;z-index:20;display:none}
.ov.show{display:block}
.back{position:absolute;inset:0;background:rgba(25,15,40,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;background:#faf8f6;border-radius:26px 26px 0 0;overflow-y:auto;padding-block:14px 26px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.3}to{transform:none;opacity:1}}
.handle{width:92px;height:7px;border-radius:4px;background:#eaf0f8;margin:0 auto 26px}
.sheet h4{margin:0}
.ctitle{display:flex;gap:16px;align-items:flex-start;font-size:29px;line-height:1.25;font-weight:700;color:var(--plum-ink);letter-spacing:-.01em;margin-bottom:34px}
.ctitle .ic{width:30px;height:30px;margin-top:6px;flex:none;color:#222}
.kv{display:flex;gap:22px;margin-bottom:26px}
.kv>.ic{width:26px;height:26px;margin-top:8px;color:#1a1a1a;flex:none}
.kv small{display:block;color:var(--slate);font-size:17px;font-weight:600}
.kv span{display:block;font-size:23px;color:#111;margin-top:2px}
.hr{border:0;border-top:1.5px solid #e3e8f0;margin:30px 0 34px}
.two2{display:grid;grid-template-columns:1fr 1fr;gap:26px 14px}
.two2 .kv{margin:0}
.kv .ic.g{color:#3fa65f}
.kv .ic.r{color:#d3322f}
.more{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;height:68px;margin-top:38px;border:1.5px solid var(--line);border-radius:14px;font-size:22px;font-weight:500;background:none}
.more .ic{width:26px;height:26px}

.dt h4{font-size:25px;font-weight:700;margin-bottom:34px;color:#111}
.dt .ti{font-size:28px;font-weight:700;color:#111;line-height:1.25}
.dt .code{font-size:20px;color:#667a99;margin-top:6px;word-break:break-all}
.dt .lab{font-size:21px;font-weight:500;margin-top:30px}
.dt .big{font-size:43px;font-weight:700;margin-top:4px;line-height:1.1;color:#111}
.dt .lab2{font-size:21px;font-weight:600;margin-top:34px}
.pos{position:relative;margin-top:6px}
.pos .tr{position:absolute;left:0;right:0;height:13px;border-radius:7px;background:#eff3f9}
.pos .fl{position:absolute;left:0;height:13px;border-radius:7px 0 0 7px;background:#e8b0b4}
.pos .th{position:absolute;width:24px;height:24px;margin:-5.5px 0 0 -12px;border-radius:50%;background:var(--red);border:3px solid #fff;box-sizing:border-box;box-shadow:0 0 0 1px #e8b0b4;z-index:3}
.pos .bub{position:absolute;top:0;transform:translateX(-50%);background:var(--red);color:#fff;font-size:15.5px;font-weight:700;padding:4px 15px;border-radius:14px;line-height:1.4;white-space:nowrap;z-index:2}
.pos .bt{position:absolute;width:2px;height:12px;background:var(--red);transform:translateX(-1px)}
.pos.ok .fl{background:#b4e0c8}
.pos.ok .th{background:var(--green);box-shadow:0 0 0 1px #b4e0c8}
.pos.ok .bub,.pos.ok .bt{background:var(--green)}
.pos .mk{position:absolute;width:2px;background:#a4afc2;transform:translateX(-1px)}
.pos .v,.pos .nm{position:absolute;transform:translateX(-50%);font-size:14.5px;color:#65748d;white-space:nowrap;line-height:1.2}
.pos .v{font-weight:600;font-size:15px}
.pos .brk{position:absolute;height:12px;border:1.5px solid #9eaac0;border-top:0;border-bottom:0;box-sizing:border-box}
.pos .brk::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1.5px solid #9eaac0}
.pos .sd{position:absolute;transform:translateX(-50%);font-size:14px;color:#9aa5b9}
.pos .z{position:absolute;font-size:14px;color:#9aa5b9}
.sep{border:0;border-top:1.5px solid #e6eaf1;margin:26px 0 30px}
.st{display:grid;grid-template-columns:1fr 1fr;gap:26px 14px}
.st small{display:block;font-size:21px;font-weight:500;color:#111}
.st span{display:block;font-size:24px;margin-top:4px;color:#222}
.dt .cm{margin-top:30px}
.dt .cm small{display:block;font-size:22px;font-weight:600}
.dt .cm p{margin:6px 0 0;font-size:21px;line-height:1.5;color:#222}

/* drawer */
.drawer{position:absolute;top:0;bottom:0;right:0;width:85%;background:var(--cream);display:flex;flex-direction:column;animation:slide .24s ease-out;padding-block:12px 0}
@keyframes slide{from{transform:translateX(50px);opacity:.2}to{transform:none;opacity:1}}
.dh{display:flex;align-items:center;justify-content:center;position:relative;height:76px;margin-top:6px}
.dh b{font-size:28px;font-weight:700}
.dh button{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:14px;width:48px;height:48px;display:grid;place-items:center;color:#333}
.dh .ic{width:34px;height:34px;stroke-width:2.2}
.dl{flex:1;overflow-y:auto;padding-top:20px}
.mi{display:flex;align-items:center;gap:20px;width:100%;text-align:left;height:84px;font-size:23px;font-weight:600;color:#111;padding:0}
.mi>.ic{width:36px;height:36px;stroke-width:2.1;flex:none}
.mi .beta{font-size:15.5px;font-weight:700;background:#eef1f7;color:#2a3550;padding:7px 17px;border-radius:14px;margin-left:-4px}
.mi .e{margin-left:auto;color:#6b7690;display:grid}

.mi.red{color:#ee1f2d}

.dsep{border:0;border-top:1.5px solid #dfe5f0;margin:12px 0 18px}
.dspace{height:240px}
.foot{padding:20px 0 30px;text-align:center;color:#6b7690;font-size:18.5px;line-height:1.55}
.foot a{color:#5a6a8c;text-decoration:underline;text-underline-offset:4px}
.foot .vers{margin-top:14px}
.dpad{padding-left:20px;padding-right:max(16px,env(safe-area-inset-right,0px))}

/* tasks */
.tk{display:flex;align-items:center;gap:14px;padding:16px;margin-top:12px}
.tk .cb{width:28px;height:28px;border-radius:8px;border:2px solid #b5bdcb;display:grid;place-items:center;flex:none;color:#fff}
.tk.done .cb{background:var(--green);border-color:var(--green)}
.tk.done strong{text-decoration:line-through;color:var(--slate)}
.tk strong{font-size:18px;font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}
.tk small{display:block;color:var(--slate);font-weight:400;font-size:15px;margin-top:2px}
.tk .del{color:#aab2c0}
.tk .del .ic{width:22px;height:22px}
.fld{display:block;margin-bottom:22px}
.fld small{display:block;color:var(--slate);font-size:16px;font-weight:600;margin-bottom:8px}
.fld input{width:100%;box-sizing:border-box;height:56px;border-radius:12px;border:1.5px solid var(--line);background:#fff;padding:0 16px;font:inherit;font-size:19px}
.fld input:focus{outline:2px solid #e68a4c;outline-offset:1px}
.btn.full{width:100%;justify-content:center;margin-top:8px}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}.sheet,.drawer{animation:none}}
</style>

<div class="app" id="app">
  <header class="top"><div class="gutter">
    <div class="brand">Mauria</div>
    <div class="top-actions"><div class="spin" id="spin" hidden></div><button class="burger" id="menuBtn" aria-label="Menu"><svg class="ic" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button></div>

</div>

 openSheet('<div class="dt"><h4>Ajouter une tâche</h4></div><form id="tf"><label class="fld"><small>Titre</small><input id="tt" required maxlength="120" placeholder="Ex. Réviser Maths 6" autocomplete="off"></label><label class="fld"><small>Date (facultatif)</small><input id="td" type="date"></label><button class="btn full" type="submit">'+ic('plus')+'Ajouter</button></form>');
 setTimeout(function(){var i=document.getElementById('tt');if(i)i.focus();},60);
 document.getElementById('tf').addEventListener('submit',function(ev){ev.preventDefault();var t=document.getElementById('tt').value.trim();if(!t)return;var dv=document.getElementById('td').value,ds='';
  if(dv){var p=dv.split('-');ds=dlabel(new Date(+p[0],+p[1]-1,+p[2]));}
  S.tasks.push({t:t,d:ds,done:false});saveT();closeAll();go('agenda');});}

/* ---- drawer ---- */

 var items=[['gear','Paramètres'],null,['heart','Associations'],['doc','Mes documents'],['printer','Imprimer'],['radar','Palantir','Beta'],['brief','Stages','Beta'],['thumb','Aurion',0,1],['book','Junia Learning',0,1]];
 var h='<div class="dh"><b>Menu</b><button data-close aria-label="Fermer">'+ic('x')+'</button></div><div class="dl dpad">';
 h+=items.map(function(m){if(!m)return '<hr class="dsep">';return '<button class="mi">'+ic(m[0])+'<span>'+m[1]+'</span>'+(m[2]?'<span class="beta">'+m[2]+'</span>':'')+(m[3]?'<span class="e">'+ic('ext')+'</span>':'')+'</button>';}).join('');

 document.getElementById('drawer').innerHTML=h;document.getElementById('drawerOv').classList.add('show');}

/* ---- events ---- */
document.getElementById('app').addEventListener('click',function(e){
 var t=e.target.closest('button,[data-close]');if(!t)return;
 if(t.hasAttribute('data-close')){closeAll();return;}
 if(t.dataset.tab){go(t.dataset.tab);return;}
 if(t.id==='menuBtn'){drawer();return;}
 if(t.dataset.ev!==undefined){courseSheet(TOM[+t.dataset.ev],new Date(2026,10,12));return;}
 if(t.dataset.pe){var p=t.dataset.pe.split('|'),ev=EV[p[0]][+p[1]],q=p[0].split('-');courseSheet(ev,new Date(+q[0],+q[1]-1,+q[2]));return;}
 if(t.dataset.gr!==undefined){gradeSheet(GR[+t.dataset.gr]);return;}
 if(t.dataset.view){S.view=t.dataset.view;render(1);return;}
 if(t.dataset.nav){var n=+t.dataset.nav,d=new Date(S.cur);d.setDate(d.getDate()+n*(S.view==='week'?7:1));S.cur=d;render(1);return;}
 if(t.dataset.gsem){S.gsem=t.dataset.gsem;render(1);return;}
 if(t.dataset.gf){S.gf=t.dataset.gf;render(1);return;}
 if(t.dataset.asem){S.asem=t.dataset.asem;render(1);return;}
 if(t.dataset.af){S.af=t.dataset.af;render(1);return;}
 if(t.hasAttribute('data-addtask')){taskSheet();return;}
 if(t.dataset.tk!==undefined){var k=S.tasks[+t.dataset.tk];k.done=!k.done;saveT();render(1);return;}
 if(t.dataset.del!==undefined){S.tasks.splice(+t.dataset.del,1);saveT();render(1);return;}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeAll();});
window.addEventListener('hashchange',function(){var t=location.hash.slice(1);if(VIEWS[t]&&t!==S.tab)go(t);});

var t0=location.hash.slice(1);if(VIEWS[t0])S.tab=t0;
render();
if(S.tab==='accueil'||S.tab==='planning'||S.tab==='absences'){var sp=document.getElementById('spin');sp.hidden=false;setTimeout(function(){sp.hidden=true;},1600);}
})();
</script>
